server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Missing assets must fail rather than return an HTML page with HTTP 200.
    location /assets/ {
        try_files $uri =404;
    }
}
