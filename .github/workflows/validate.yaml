name: Validate build definitions
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: definitions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test source selection and startup compatibility
        run: python3 -m unittest discover -s tests -v
      - name: Validate workflow expressions and shell commands
        env:
          ACTIONLINT_VERSION: '1.7.12'
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSL "$base/$archive" -o "$RUNNER_TEMP/$archive"
          curl -fsSL "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt" -o "$RUNNER_TEMP/actionlint-checksums"
          grep " $archive\$" "$RUNNER_TEMP/actionlint-checksums" > "$RUNNER_TEMP/actionlint-selected-checksum"
          (cd "$RUNNER_TEMP" && sha256sum -c actionlint-selected-checksum)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
