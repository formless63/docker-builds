name: Build Maxun Browser

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"
  push:
    paths:
      - ".github/workflows/maxun-browser.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/maxun-browser
  MAXUN_REF: develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Maxun browser image
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/getmaxun/maxun.git#${{ env.MAXUN_REF }}
          file: browser/Dockerfile
          push: true
          build-args: |
            BROWSER_WS_PORT=3001
            BROWSER_HEALTH_PORT=3002
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.MAXUN_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
