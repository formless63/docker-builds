name: Build SuperSync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 */3 * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/supersync

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Upstream Repo
        uses: actions/checkout@v6
        with:
          repository: super-productivity/super-productivity
          ref: master

      - name: Record upstream revision
        id: src
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=true
          tags: |
            # Tag 1: The date (e.g., :2026-02-09) - Works for manual AND schedule
            type=raw,value={{date 'YYYY-MM-DD'}}
            # Tag 2: The upstream commit actually built. type=sha would use
            # this repo's SHA, which is identical across every build and says
            # nothing about the image contents.
            type=raw,value=upstream-${{ steps.src.outputs.sha }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .  
          file: packages/super-sync-server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=supersync
          cache-to: type=gha,mode=max,scope=supersync
