name: Build iframely

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish validated images (main branch only)'
        type: boolean
        default: false
  schedule:
    - cron: '0 4 * * 0'
  push:
    branches: [main]
    paths:
      - '.github/workflows/iframely.yaml'
      - '.github/workflows/build-image.yaml'
      - 'scripts/**'
  pull_request:
    paths:
      - '.github/workflows/iframely.yaml'
      - '.github/workflows/build-image.yaml'
      - 'scripts/**'

permissions:
  contents: read
  packages: write

# A newer run supersedes an older build before it can promote stale tags.
concurrency:
  group: image-iframely-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-image.yaml
    with:
      target: iframely
      publish: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
